name: Daily German Vocabulary Bot

on:
  schedule:
    # هر روز ساعت 06:30 به وقت تهران (03:00 UTC) اجرا می‌شه.
    # اگه می‌خوای ساعت رو عوض کنی: https://crontab.guru برات کمک می‌کنه.
    - cron: "0 3 * * *"
  workflow_dispatch: {}  # امکان اجرای دستی از تب Actions برای تست

jobs:
  send-lesson:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python daily_german_bot.py
